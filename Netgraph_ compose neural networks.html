<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netgraph: compose neural networks</title>
<!-- Built from src/ by build.mjs. Edit the files in src/, then run: node build.mjs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#000; --grid:rgba(255,255,255,.075); --panel:#020202; --line:rgba(255,255,255,.09);
  --node:#050505; --node-line:rgba(255,255,255,.2); --ink:#F5F7FB; --muted:#8C919B;
  --wire:rgba(255,255,255,.6); --sel:#FFFFFF; --err:#FF4D6D; --warn:#FFC857; --chip:#101010;
  --neon:0 0 1px #fff,0 0 6px rgba(255,255,255,.75),0 0 18px rgba(210,225,255,.35);
  --neon-sm:0 0 1px #fff,0 0 5px rgba(255,255,255,.5);
  --neon-txt:0 0 4px rgba(255,255,255,.7),0 0 14px rgba(210,225,255,.35);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;accent-color:#fff}
*{scrollbar-color:#1c1c1c #000;scrollbar-width:thin}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid #fff;outline-offset:2px;box-shadow:var(--neon-sm)}

.app{height:100%;display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top" "pal cv"}
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;text-shadow:var(--neon-txt)}
.brand svg{display:block;filter:drop-shadow(0 0 3px rgba(255,255,255,.8))}
.tools{display:flex;gap:6px;overflow-x:auto;min-width:0;padding:4px}
.tb{border:1px solid rgba(255,255,255,.14);background:transparent;border-radius:4px;padding:5px 11px;font-size:13px;white-space:nowrap;transition:border-color .15s,box-shadow .15s,text-shadow .15s}
.tb:hover{border-color:rgba(255,255,255,.55);box-shadow:0 0 8px rgba(255,255,255,.18);text-shadow:0 0 6px rgba(255,255,255,.5)}
.tb[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.07);box-shadow:var(--neon-sm),inset 0 0 8px rgba(255,255,255,.15);text-shadow:var(--neon-txt)}
.tb.primary{border-color:#fff;color:#fff;box-shadow:var(--neon),inset 0 0 10px rgba(255,255,255,.12);text-shadow:var(--neon-txt)}
.tb.primary:hover{background:rgba(255,255,255,.06);box-shadow:0 0 1px #fff,0 0 10px rgba(255,255,255,.9),0 0 26px rgba(210,225,255,.5),inset 0 0 12px rgba(255,255,255,.2)}
.tb kbd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px;text-shadow:none}
.tb[aria-pressed="true"] kbd,.tb.primary kbd{color:inherit;opacity:.7}

.pal{grid-area:pal;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 24px}
.pal h3{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 4px 6px}
.pal h3:first-child{margin-top:2px}
.pi{display:flex;align-items:center;gap:9px;padding:6px 8px;margin:2px 0;border-radius:4px;cursor:grab;user-select:none;touch-action:none;border:1px solid transparent;font-size:13.5px;color:#C9CDD5;transition:border-color .15s,box-shadow .15s,color .15s}
.pi:hover{color:#fff;border-color:rgba(255,255,255,.35);box-shadow:0 0 10px rgba(255,255,255,.12);text-shadow:0 0 6px rgba(255,255,255,.5)}
.pi .sw{width:3px;height:16px;border-radius:2px;background:var(--fam);flex:none;box-shadow:0 0 6px var(--fam)}
.pi.blk .sw{width:11px;height:11px;border-radius:2px;background:none;border:1.5px solid var(--fam);box-shadow:3px 3px 0 -1px var(--panel),3px 3px 0 0 var(--fam),0 0 6px var(--fam)}
.pi.off{opacity:.3;cursor:not-allowed}
.pi .x{margin-left:auto;border:0;background:none;color:var(--muted);padding:0 4px;font-size:16px;line-height:1}
.pi .x:hover{color:var(--err);text-shadow:0 0 6px var(--err)}
.pal .empty{font-size:12.5px;color:var(--muted);margin:2px 4px}

.cv{grid-area:cv;position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);
  background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.3px)}
.cv::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:-5000px;top:-5000px;width:20000px;height:20000px;pointer-events:none;overflow:visible}
#wg{filter:drop-shadow(0 0 2px rgba(255,255,255,.55)) drop-shadow(0 0 6px rgba(210,225,255,.25))}
.w{fill:none;stroke:var(--wire);stroke-width:1.5}
.w.bad{stroke:var(--err);stroke-dasharray:6 4}
.w.on{stroke:#fff;stroke-width:2.5}
.w.ref{stroke-dasharray:2 5;stroke-opacity:.75}
.w.tmp{stroke:#fff;stroke-dasharray:5 4}
.whit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:grab}
.wh{fill:#000;stroke:#fff;stroke-width:1.5;pointer-events:all;cursor:move;filter:drop-shadow(0 0 3px #fff)}
.wl{font:500 10.5px var(--mono);fill:#B8BDC6;paint-order:stroke;stroke:#000;stroke-width:5px;text-anchor:middle;pointer-events:none}

.node{position:absolute;width:200px;min-height:86px;background:var(--node);border:1px solid var(--node-line);border-radius:6px;
  user-select:none;touch-action:none;cursor:grab;box-shadow:0 0 0 1px rgba(0,0,0,.9),0 0 14px rgba(255,255,255,.04);transition:border-color .15s,box-shadow .15s}
.node:hover{border-color:rgba(255,255,255,.4);box-shadow:0 0 12px rgba(255,255,255,.1)}
.node.grp{border-width:1px;box-shadow:5px 5px 0 -1px #000,5px 5px 0 0 var(--node-line)}
.node.sel{border-color:#fff;box-shadow:var(--neon),inset 0 0 14px rgba(255,255,255,.06)}
.node.grp.sel{box-shadow:var(--neon),6px 6px 0 -1px #000,6px 6px 0 0 #fff,6px 6px 10px 0 rgba(255,255,255,.35)}
.node.bad{border-color:var(--err);box-shadow:0 0 1px var(--err),0 0 10px color-mix(in srgb,var(--err) 45%,transparent)}
.node.bad.sel{box-shadow:var(--neon)}
.nh{height:28px;display:flex;align-items:center;gap:8px;padding:0 9px 0 11px;border-radius:5px 5px 0 0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--fam) 16%,#000),#000 75%);border-bottom:1px solid var(--line);box-shadow:inset 2px 0 0 var(--fam)}
.nt{font-weight:500;font-size:13px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.45)}
.nn{margin-left:auto;font:400 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.nb{padding:6px 11px 8px;font-size:12px}
.ns{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nshape{font:500 12px var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 0 5px rgba(255,255,255,.35)}
.nshape .ar{color:var(--muted);text-shadow:none}
.nshape .k{color:var(--muted);font-weight:400;text-shadow:none}
.np{color:var(--muted);font-size:11.5px;margin-top:1px}
.msg{font-size:11.5px;margin-top:4px;line-height:1.3}
.msg.err{color:var(--err);text-shadow:0 0 6px color-mix(in srgb,var(--err) 50%,transparent)} .msg.warn{color:var(--warn)} .msg.wait{color:var(--muted)}
.port{position:absolute;width:11px;height:11px;border-radius:50%;background:#000;border:1.5px solid rgba(255,255,255,.7);cursor:crosshair;z-index:2;box-shadow:0 0 5px rgba(255,255,255,.35);transform:translate(-50%,-50%);transition:transform .1s,box-shadow .1s}
.port::after{content:"";position:absolute;inset:-9px}
.port.out{background:#fff;border-color:#fff;box-shadow:var(--neon)}
.port:hover{transform:translate(-50%,-50%) scale(1.35);border-color:#fff;box-shadow:var(--neon)}
.port .pl{position:absolute;left:12px;top:-4px;font:10px var(--mono);color:var(--muted);pointer-events:none}

.crumbs{position:absolute;left:12px;top:10px;z-index:5;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.85);border:1px solid var(--line);border-radius:5px;padding:3px 4px;font-size:13px;backdrop-filter:blur(4px)}
.crumbs button{border:0;background:none;padding:2px 7px;border-radius:3px;color:#C9CDD5}
.crumbs button:hover{background:var(--chip);color:#fff}
.crumbs button[aria-current]{font-weight:500;cursor:default;color:#fff;text-shadow:var(--neon-txt)}
.crumbs button[aria-current]:hover{background:none}
.crumbs .sep{color:var(--muted)}
.zoom{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:4px}
.zoom button{border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.85);border-radius:4px;min-width:32px;height:32px;padding:0 9px;transition:border-color .15s,box-shadow .15s}
.zoom button:hover{border-color:#fff;box-shadow:var(--neon-sm)}
.box{position:absolute;border:1px solid #fff;background:rgba(255,255,255,.05);box-shadow:var(--neon-sm),inset 0 0 12px rgba(255,255,255,.08);pointer-events:none;z-index:6}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;background:#000;color:#fff;border:1px solid #fff;box-shadow:var(--neon);text-shadow:0 0 5px rgba(255,255,255,.4);padding:7px 14px;border-radius:5px;font-size:13px;max-width:min(520px,80%);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.ghost{position:fixed;z-index:50;pointer-events:none;background:#000;border:1px solid #fff;border-radius:4px;padding:5px 10px;font-size:13px;color:#fff;box-shadow:var(--neon);text-shadow:var(--neon-txt)}

.insp{position:absolute;top:12px;right:12px;z-index:5;width:256px;max-width:calc(100% - 24px);max-height:calc(100% - 72px);overflow-y:auto;padding:12px 14px 14px;background:rgba(0,0,0,.88);border:1px solid rgba(255,255,255,.16);border-radius:6px;box-shadow:0 0 18px rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.insp:empty{display:none}
.insp h2{font-size:15px;font-weight:500;margin:0 0 2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:#fff;text-shadow:var(--neon-txt)}
.insp h2 small{font:400 12.5px var(--mono);color:var(--muted);text-shadow:none}
.insp .lead{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.dims{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;border-top:1px solid var(--line);padding:8px 0 0;margin:8px 0 10px}
.dims span{color:var(--muted);font-size:12.5px}
.dims b{font:500 13px var(--mono);text-align:right;overflow-wrap:anywhere;color:#fff;text-shadow:0 0 5px rgba(255,255,255,.4)}
.insp .err{color:var(--err);font-size:13px;margin:0 0 10px}
.insp .warn{color:var(--warn);font-size:13px;margin:0 0 10px}
.f{display:block;margin:0 0 10px}
.f > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.f input[type=text]{width:100%;border:1px solid rgba(255,255,255,.14);background:#000;border-radius:4px;padding:6px 8px;font-family:var(--mono);font-size:13px;transition:border-color .15s,box-shadow .15s}
.f input[type=text]:focus{border-color:#fff;outline:none;box-shadow:var(--neon-sm)}
.f small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .tb{padding:4px 9px;font-size:12.5px}
.insp p.help{font-size:13px;color:var(--muted);margin:14px 0 0}
.insp p.help + p.help{margin-top:8px}
.insp ul.layers{list-style:none;padding:0;margin:4px 0 0;font-size:12.5px}
.insp ul.layers li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.insp ul.layers li code{font-family:var(--mono);color:var(--muted)}

dialog{border:1px solid rgba(255,255,255,.5);border-radius:6px;background:#000;color:var(--ink);padding:0;width:min(760px,94vw);max-height:86vh;box-shadow:var(--neon)}
dialog::backdrop{background:rgba(0,0,0,.8);backdrop-filter:blur(2px)}
.dh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dh h2{font-size:15px;font-weight:500;margin:0 auto 0 0;text-shadow:var(--neon-txt)}
dialog pre{margin:0;padding:14px 16px;overflow:auto;max-height:calc(86vh - 60px);font:12.5px/1.55 var(--mono);background:#000;color:#E6E9EF}

/* network-icon nodes (MLP blocks, Dense layers) */
.node.net{background:transparent;border-color:transparent;box-shadow:none;min-height:0}
.node.net:hover{border-color:rgba(255,255,255,.14);box-shadow:none}
.node.net.sel{border-color:rgba(255,255,255,.35);box-shadow:0 0 14px rgba(255,255,255,.12)}
.node.net.bad{border-color:color-mix(in srgb,var(--err) 60%,transparent);box-shadow:none}
.mini{display:block;width:100%;height:auto;aspect-ratio:200/92;overflow:visible}
.mini .ml{stroke:#fff;stroke-opacity:.22;stroke-width:.8}
.mini .mn{fill:#000;stroke:#fff;stroke-width:1.3}
.mini .mn.g{stroke-opacity:.75}
.mini .md{fill:#fff;fill-opacity:.7;font:600 11px var(--mono);text-anchor:middle}
.mini g{filter:drop-shadow(0 0 2px rgba(255,255,255,.6))}
.node.net.sel .mini g{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px rgba(255,255,255,.5))}
.node.net.bad .mini .mn{stroke:var(--err)}
.mcap{padding:2px 8px 6px;text-align:center;font-size:12px}
.mcap .mt{font-weight:500;font-size:13px;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcap .mt small{font:400 11px var(--mono);color:var(--muted);text-shadow:none;margin-left:6px}
.mcap .nshape,.mcap .ns{text-align:center}
.mcap .mk{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fam);box-shadow:0 0 6px var(--fam);margin-right:6px;vertical-align:1px}

/* neuron view */
#neuro{position:absolute;left:-5000px;top:-5000px;width:20000px;height:20000px;pointer-events:none;overflow:visible;display:none}
.cv.neuro #neuro{display:block}
.cv.neuro #nodes,.cv.neuro #wires{display:none}
.nl{stroke:#fff;stroke-opacity:.14;stroke-width:1}
.nl.frus{stroke-dasharray:4 4;stroke-opacity:.35}
#ng.focus .nl{stroke-opacity:.05}
#ng.focus .nl.frus{stroke-opacity:.2}
.nl.hot,#ng.focus .nl.hot{stroke-opacity:.95;stroke-width:1.4;filter:drop-shadow(0 0 3px #fff)}
.nu{fill:#000;stroke:#fff;stroke-width:1.5;pointer-events:all;cursor:pointer;filter:drop-shadow(0 0 3px rgba(255,255,255,.7))}
.nu.act{fill:rgba(255,255,255,.18)}
.nu.hot{fill:#fff;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 12px rgba(255,255,255,.6))}
.nmap{fill:#000;stroke:#fff;stroke-opacity:.45;stroke-width:1.1}
.nmap.front{stroke-opacity:1;filter:drop-shadow(0 0 3px rgba(255,255,255,.6))}
.ndots{fill:var(--muted);font:600 16px var(--mono);text-anchor:middle}
.nname{fill:#fff;font:500 13px var(--sans);text-anchor:middle;filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}
.nkind{font:500 10px var(--mono);letter-spacing:.12em;text-anchor:middle}
.ncount{fill:#fff;font:500 14px var(--mono);text-anchor:middle}
.ntag{fill:var(--muted);font:11px var(--mono);text-anchor:middle}
.nw{fill:var(--muted);font:10.5px var(--mono);text-anchor:middle}
.nbr{fill:none;stroke:rgba(255,255,255,.4)}
.nbrt{fill:#C9CDD5;font:500 11px var(--mono);letter-spacing:.12em;text-anchor:middle}

/* diving between levels */
.node.dive{border-color:#fff;box-shadow:0 0 1px #fff,0 0 calc(6px + 40px*var(--d,0)) rgba(255,255,255,calc(.25 + .6*var(--d,0)))}
.crumbs.surf{border-color:#fff;box-shadow:0 0 calc(4px + 30px*var(--d,0)) rgba(255,255,255,calc(.2 + .6*var(--d,0)))}
.cv.enter .world{animation:dive .32s ease-out}
@keyframes dive{from{opacity:0}}
.crumbs .seg{display:flex;gap:2px;margin-left:4px;padding-left:6px;border-left:1px solid var(--line)}
.crumbs .seg button[aria-pressed="true"]{color:#fff;background:rgba(255,255,255,.08);box-shadow:var(--neon-sm);text-shadow:var(--neon-txt)}

/* data component + inference previews */
.dn{display:flex;align-items:center;gap:10px;margin-top:6px}
.dimg{width:56px;height:56px;flex:none;background:#000;border:1px solid rgba(255,255,255,.25);border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.12)}
.dl{font:12px var(--mono);color:var(--muted)}
.dl b{color:#fff;font-size:16px;text-shadow:var(--neon-txt);margin-left:2px}
canvas.act.v{display:block;width:100%;height:12px;margin-top:6px;border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.12)}
.act.m{display:flex;gap:3px;align-items:center;margin-top:6px}
.act.m canvas{width:24px;height:24px;border:1px solid rgba(255,255,255,.15);border-radius:2px}
.act.m span{font:10.5px var(--mono);color:var(--muted);margin-left:2px}
.pred{display:flex;gap:2px;align-items:stretch;height:44px;margin-top:6px}
.pred.big{height:76px}
.pb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.pb s{flex:1;align-self:stretch;position:relative}
.pb i{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.28);border-radius:1px}
.pb b{font:500 9.5px var(--mono);color:var(--muted)}
.pb.hi i{background:#fff;box-shadow:var(--neon-sm)}
.pb.hi b{color:#fff;text-shadow:var(--neon-txt)}
.pb.lab b{text-decoration:underline;text-underline-offset:2px}
.pv{font-size:12px;color:var(--muted);margin-top:4px}
.pv b{color:#fff;font:600 14px var(--mono);text-shadow:var(--neon-txt);margin-left:2px}
.pv em{font-style:normal;margin-left:6px}
.pv .ok{color:#fff}
.pv .no{color:var(--err)}
.dbig{display:block;width:100%;max-width:150px;aspect-ratio:1;margin:8px auto 2px;background:#000;border:1px solid rgba(255,255,255,.25);border-radius:4px;box-shadow:0 0 18px rgba(255,255,255,.15)}
.step{display:flex;gap:4px;margin:0 0 10px}
.step input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.14);background:#000;border-radius:4px;padding:4px 8px;font:13px var(--mono);text-align:center}
.step input:focus{border-color:#fff;outline:none;box-shadow:var(--neon-sm)}
.step .tb{padding:4px 10px}
.f select{width:100%;border:1px solid rgba(255,255,255,.14);background:#000;border-radius:4px;padding:6px 8px;font-size:13px}
.actp{margin:10px 0;border-top:1px solid var(--line);padding-top:8px}
.actp .cap{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.actp .dims{border-top:0;padding-top:4px;margin-bottom:0}
.actp canvas.act.v{height:20px}
.chgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.chgrid canvas{width:100%;aspect-ratio:1;border:1px solid rgba(255,255,255,.15);border-radius:2px}
.nimg{display:block;width:100%;height:100%}
.nmapo{fill:none;stroke:#fff;stroke-width:1.2;filter:drop-shadow(0 0 3px rgba(255,255,255,.6))}
.nlab{font:500 12px var(--mono);fill:var(--muted)}
.nlab.hi{fill:#fff;font-weight:600;filter:drop-shadow(0 0 3px #fff)}

canvas.plot{display:block;width:100%;aspect-ratio:1;margin-top:6px;background:#000;border-radius:3px}

<script id="engine">
/* ===== engine/model.js ===== */
/* Netgraph engine: the graph model.
   The engine has no DOM: it runs in the page, in the training worker and in the Node tests.
   Graphs are {nodes, edges}; a node is {id, type, name, x, y, props} (plus .graph for a block). */
const uid = () => Math.random().toString(36).slice(2, 10);
const DEFS = {
  input:    {label:'Input', fam:'io', ins:0, outs:1, props:{shape:'1,28,28'}},
  output:   {label:'Output', fam:'io', ins:1, outs:0},
  dense:    {label:'Dense', fam:'dense', ins:1, outs:1, props:{in_features:'auto', out_features:128, bias:true}},
  conv2d:   {label:'Conv2D', fam:'conv', ins:1, outs:1, props:{in_channels:'auto', out_channels:32, kernel:3, stride:1, padding:1}},
  maxpool:  {label:'MaxPool2D', fam:'pool', ins:1, outs:1, props:{kernel:2, stride:'auto'}},
  avgpool:  {label:'AvgPool2D', fam:'pool', ins:1, outs:1, props:{kernel:2, stride:'auto'}},
  gap:      {label:'Global Avg Pool', fam:'pool', ins:1, outs:1},
  relu:     {label:'ReLU', fam:'act', ins:1, outs:1},
  gelu:     {label:'GELU', fam:'act', ins:1, outs:1},
  sigmoid:  {label:'Sigmoid', fam:'act', ins:1, outs:1},
  tanh:     {label:'Tanh', fam:'act', ins:1, outs:1},
  softmax:  {label:'Softmax', fam:'act', ins:1, outs:1},
  batchnorm:{label:'BatchNorm', fam:'norm', ins:1, outs:1},
  dropout:  {label:'Dropout', fam:'norm', ins:1, outs:1, props:{p:0.5}},
  flatten:  {label:'Flatten', fam:'shape', ins:1, outs:1},
  unflatten:{label:'Unflatten', fam:'shape', ins:1, outs:1, props:{to:'auto'}},
  add:      {label:'Add', fam:'merge', ins:2, outs:1},
  concat:   {label:'Concat', fam:'merge', ins:2, outs:1},
  group:    {label:'Block', fam:'block', ins:1, outs:1},
  gin:      {label:'Block input', fam:'io', ins:0, outs:1},
  gout:     {label:'Block output', fam:'io', ins:1, outs:0},
  data:     {label:'Data', fam:'data', ins:1, outs:1, props:{dataset:'', flatten:false, index:0, test:20, seed:1, run_from:'test', run_n:'all'}},
  sliders:  {label:'Sliders', fam:'io', ins:0, outs:1, props:{sliders:[{name:'a', value:0, min:-1, max:1, step:0.01}, {name:'b', value:0, min:-1, max:1, step:0.01}]}},
  pca:      {label:'PCA', fam:'shape', ins:1, outs:1, props:{components:2, fit_n:5000}},
  plot2d:   {label:'Plot 2D', fam:'io', ins:1, outs:0, props:{x_dim:0, y_dim:1}},
  plot3d:   {label:'Plot 3D', fam:'io', ins:1, outs:0, props:{x_dim:0, y_dim:1, z_dim:2}},
  ptrin:    {label:'Pointer in', fam:'ptr', ins:1, outs:1, props:{target:''}},
  ptrout:   {label:'Pointer out', fam:'ptr', ins:1, outs:1, props:{pair:''}},
  activation:{label:'Activation', fam:'act', ins:1, outs:1, props:{fn:'x'}},
  loss:     {label:'Loss', fam:'loss', ins:0, outs:1, props:{expr:'', optimizer:'adam', lr:0.001, batch:32, epochs:1}},
};
const SHORT = {input:'x', output:'out', dense:'fc', conv2d:'conv', maxpool:'pool', avgpool:'avgpool', gap:'gap', relu:'relu', gelu:'gelu', sigmoid:'sigmoid', tanh:'tanh', softmax:'softmax', batchnorm:'bn', dropout:'drop', flatten:'flatten', unflatten:'unflatten', add:'add', concat:'cat', gin:'in', gout:'out', data:'data', loss:'loss', activation:'act', sliders:'sliders', ptrin:'pin', ptrout:'pout', plot2d:'plot', plot3d:'plot3d', pca:'pca'};
const PLOTS = new Set(['plot2d', 'plot3d']);   // components that show what reaches them and keep what inference runs send

/* ---------- state ---------- */
let root = {nodes:[], edges:[]};
let stats = {params:0, errs:0, ins:[], outs:[]};
const byId = (g, id) => g.nodes.find(n => n.id === id);
function findNode(id, g = root){ for (const n of g.nodes){ if (n.id === id) return n; if (n.graph){ const m = findNode(id, n.graph); if (m) return m; } } return null; }   // anywhere, inside blocks too
const edge = (from, to, port=0) => ({id:uid(), from, to, port});
function allNames(g=root, set=new Set()){ for (const n of g.nodes){ set.add(n.name); if (n.graph) allNames(n.graph, set); } return set; }
function nextName(type){ const b = SHORT[type]; const s = allNames(); if (type==='input' && !s.has('x')) return 'x'; let i=1; while (s.has(b+i)) i++; return b+i; }
function localName(g, type){ const b = SHORT[type]; let i=1; while (g.nodes.some(n => n.name === b+i)) i++; return b+i; }
function nextBlockName(base){ const s = allNames(); if (!s.has(base)) return base; let i=2; while (s.has(base+' '+i)) i++; return base+' '+i; }
function mk(type, x, y, props={}, name){
  if (ACT_PRESETS[type]) return mk('activation', x, y, {fn:ACT_PRESETS[type].fn, ...props}, name || nextName(type));   // ReLU & co. are Activations
  const d = DEFS[type];
  return {id:uid(), type, x, y, name: name || nextName(type), props:{...JSON.parse(JSON.stringify(d.props||{})), ...props}};
}

/* ---------- blocks ---------- */
function blockFrom(name, specs){
  const g = {nodes:[], edges:[]};
  const gin = mk('gin', 0, 0, {}, 'in'); g.nodes.push(gin); let prev = gin;
  specs.forEach(([t,p], i) => { const n = mk(t, (i+1)*240, 0, p||{}, localName(g,t)); g.nodes.push(n); g.edges.push(edge(prev.id, n.id)); prev = n; });

      for (let r = 0; r < m; r++){ const apr = A[p*m + r], aqr = A[q*m + r]; A[p*m + r] = c*apr - s*aqr; A[q*m + r] = s*apr + c*aqr; }

    }

}
// The top k eigenvectors of the covariance C (S×S): exactly for small S, otherwise by subspace iteration and a
// Rayleigh–Ritz step. Returns them sorted by eigenvalue, largest first.
async function topEig(C, S, k, hooks){
  if (S <= 160){ const {vals, V} = jacobiEig(C.slice(), S); const ord = vals.map((v, i) => i).sort((a, b) => vals[b] - vals[a]).slice(0, k); return {vals:ord.map(i => vals[i]), vecs:ord.map(i => Float64Array.from({length:S}, (_, r) => V[r*S + i]))}; }
  const K = Math.min(S, k + 8), r = rng(12345), Q = Array.from({length:K}, () => Float64Array.from({length:S}, () => r() - .5));
  const orth = () => { for (let a = 0; a < K; a++){ const q = Q[a]; for (let b = 0; b < a; b++){ let d = 0; for (let i = 0; i < S; i++) d += q[i]*Q[b][i]; for (let i = 0; i < S; i++) q[i] -= d*Q[b][i]; } let nn = 0; for (let i = 0; i < S; i++) nn += q[i]*q[i]; nn = Math.sqrt(nn) || 1; for (let i = 0; i < S; i++) q[i] /= nn; } };
  const mul = q => { const z = new Float64Array(S); for (let i = 0; i < S; i++){ let s = 0; const o = i*S; for (let j = 0; j < S; j++) s += C[o + j]*q[j]; z[i] = s; } return z; };
  orth(); let prev = 0, last = now();
  for (let it = 0; it < 300; it++){
    for (let a = 0; a < K; a++) Q[a] = mul(Q[a]);
    orth();
    let ray = 0; for (let a = 0; a < k; a++){ const z = mul(Q[a]); for (let i = 0; i < S; i++) ray += Q[a][i]*z[i]; }
    if (it > 5 && Math.abs(ray - prev) <= 1e-10*Math.abs(ray)) break; prev = ray;
    if (hooks && now() - last > 30){ await hooks.yield(); last = now(); }
  }
  const CQ = Q.map(mul), T = new Float64Array(K*K);
  for (let a = 0; a < K; a++) for (let b = 0; b < K; b++){ let s = 0; for (let i = 0; i < S; i++) s += Q[a][i]*CQ[b][i]; T[a*K + b] = s; }
  for (let a = 0; a < K; a++) for (let b = a + 1; b < K; b++) T[a*K + b] = T[b*K + a] = (T[a*K + b] + T[b*K + a])/2;
  const {vals, V} = jacobiEig(T, K), ord = vals.map((v, i) => i).sort((a, b) => vals[b] - vals[a]).slice(0, k);
  return {vals:ord.map(i => vals[i]), vecs:ord.map(j => { const v = new Float64Array(S); for (let a = 0; a < K; a++){ const w = V[a*K + j]; for (let i = 0; i < S; i++) v[i] += w*Q[a][i]; } return v; })};
}
/* Fits a PCA component on what reaches it: the first fit_n samples of the train split of the Data component
   upstream (all of them when it has no train split), run through the network as it is now. */
async function fitPCA(id, hooks){
  infer();
  const n = findNode(id); if (!n || n.type !== 'pca') throw new Error('That PCA component is gone.');
  if (n._r && n._r.err) throw new Error(n._r.err);
  const d = upstreamData(n._g || root, n), ds = d && dsById(d.props.dataset);
  if (!ds || (d._collect && !ds.x)) throw new Error('No Data component with samples feeds it.');
  const sp = splitOf(d), pool = sp.train.length ? sp.train : sp.test, f = String(n.props.fit_n ?? 'all').trim().toLowerCase();
  const idxs = pool.subarray(0, f === 'all' ? pool.length : Math.min(pool.length, Math.floor(Number(f))));
  const S = sizeOf(n._in[0]), k = Number(n.props.components), N = idxs.length;
  if (N < 2) throw new Error('It needs at least 2 samples to fit on.');
  const mean = new Float64Array(S), C = new Float64Array(S*S), ctx = {src:d, loss:null, ds, pg:new Map()};
  let got = 0, last = now();
  for (let i = 0; i < N && !hooks.shouldStop(); i += 256){
    const part = idxs.subarray(i, Math.min(N, i + 256));
    Object.assign(ctx, {B:part.length, train:false, out:new Map(), ins:new Map(), grad:new Map(), masks:new Map(), bn:new Map(), seeded:new Set(), order:new Map(), cap:new Map(), L:null});
    fwdT(root, null, batchOf(ds, part, d.props.flatten), ctx);
    const t = ctx.cap.get(n.id); if (!t) throw new Error('Nothing reaches it from the Data component.');
    for (let b = 0; b < t.B; b++){
      const x = t.data.subarray(b*S, (b + 1)*S);
      for (let a = 0; a < S; a++){ const xa = x[a]; if (!xa) continue; mean[a] += xa; const o = a*S; for (let c = a; c < S; c++) C[o + c] += xa*x[c]; }
      got++;
      if (now() - last > 30){ await hooks.yield(); last = now(); if (hooks.progress) hooks.progress(got, N); }
    }
  }
  if (got < 2) throw new Error('Stopped before it had 2 samples.');
  for (let a = 0; a < S; a++) mean[a] /= got;
  let trace = 0;
  for (let a = 0; a < S; a++) for (let c = a; c < S; c++){ const v = (C[a*S + c] - got*mean[a]*mean[c])/(got - 1); C[a*S + c] = C[c*S + a] = v; if (a === c) trace += v; }
  const {vals, vecs} = await topEig(C, S, k, hooks);
  const W = new Float32Array(k*S), ratio = new Float32Array(k);
  vecs.forEach((v, j) => {
    let big = 0; for (let i = 0; i < S; i++) if (Math.abs(v[i]) > Math.abs(v[big])) big = i;   // a fixed sign: its largest entry positive
    const s = v[big] < 0 ? -1 : 1; for (let i = 0; i < S; i++) W[j*S + i] = s*v[i];
    ratio[j] = trace > 0 ? Math.max(0, vals[j])/trace : 0;
  });
  wcache.set(n.id, {key:`pca:${S}:${k}`, W, B:Float32Array.from(mean), rm:ratio, trained:true});
  return {n:got, k, S, ratio:Array.from(ratio), d};
}

/* ===== engine/export.js ===== */
/* Netgraph engine: PyTorch export.
   exportPlan() lays out a PyTorch module for the graph: the same layers under readable names, a forward() that
   also keeps every intermediate value in self.acts, and Loss and Flatten expressions translated to torch code.
   codegen() writes it as Python; stateDict() gives the current weights under the module's parameter names;
   safetensors() packs those into a file that model.load_state_dict(load_file(...)) reads. */
const pyName = s => { let n = String(s).toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '') || 'layer'; if (/^\d/.test(n)) n = 'l_' + n; return n; };
function moduleOf(n){
  const p = n._p || n.props, x = (n._in && n._in[0]) || [], o = n._out || [], q = v => v ?? '?';
  switch (n.type){
    case 'dense': return `nn.Linear(${q(x[x.length-1])}, ${q(o[o.length-1])}${p.bias ? '' : ', bias=False'})`;
    case 'conv2d': return `nn.Conv2d(${q(x[0])}, ${q(o[0])}, kernel_size=${p.kernel}, stride=${p.stride}, padding=${p.padding})`;
    case 'maxpool': return `nn.MaxPool2d(${p.kernel}, stride=${isAuto(p.stride) ? p.kernel : p.stride})`;
    case 'avgpool': return `nn.AvgPool2d(${p.kernel}, stride=${isAuto(p.stride) ? p.kernel : p.stride})`;
    case 'gap': return `nn.Sequential(nn.AdaptiveAvgPool2d(1), nn.Flatten())`;
    case 'flatten': return `nn.Flatten()`;
    case 'unflatten': return x.length > 1 ? `nn.Sequential(nn.Flatten(), nn.Unflatten(1, (${o.join(', ')})))` : `nn.Unflatten(1, (${o.join(', ')}${o.length === 1 ? ',' : ''}))`;
    case 'batchnorm': return `nn.BatchNorm${x.length === 3 ? '2d' : '1d'}(${q(x[0])})`;
    case 'dropout': return `nn.Dropout(p=${p.p})`;
    case 'activation': { const k = presetOf(n); return k ? moduleOf({...n, type:k}) : 'nn.Identity()'; }
    case 'relu': return `nn.ReLU()`;
    case 'gelu': return `nn.GELU(approximate="tanh")`;   // the same curve Netgraph uses
    case 'sigmoid': return `nn.Sigmoid()`;
    case 'tanh': return `nn.Tanh()`;
    case 'softmax': return `nn.Softmax(dim=${x.length === 1 ? -1 : 1})`;
    case 'pca': { const lin = `nn.Linear(${q(x.reduce((a, b) => a*b, 1))}, ${q(o[0])}).requires_grad_(False)`; return x.length > 1 ? `nn.Sequential(nn.Flatten(), ${lin})` : lin; }   // fixed: components · (x − mean)
  }
  return 'nn.Identity()';
}
// Torch code for an expression's value, laid out per sample in the given shape.
const shapeCode = (r, sh) => r.k === 'b' ? `${r.c}.reshape(-1, ${sh.join(', ')})` : r.k === 'w' ? `${r.c}.reshape(1, ${sh.join(', ')}).expand(_B, ${sh.map(() => -1).join(', ')})` : `torch.full((_B, ${sh.join(', ')}), ${r.c})`;
const pyNum = v => Number.isInteger(v) ? `${v}.0` : String(v);

function exportPlan(){
  infer();
  const used = new Set(['self', 'torch', 'nn', 'F', 'None', 'model', 'y', 'load_file', 'train', 'Net']);
  const un = b => { const base = pyName(b); let k = base, i = 2; while (used.has(k)) k = base + '_' + (i++); used.add(k); return k; };
  const plan = {init:[], fwd:[], args:[], rets:[], consts:[], losses:[], varOf:new Map(), mods:new Map(), pathOf:pathMap(), needB:false};
  // Picks positions out of a flattened tensor: a slice when they are contiguous, an index tensor otherwise.
  const pick = pos => {
    let run = true; for (let i = 1; i < pos.length; i++) if (pos[i] !== pos[0] + i){ run = false; break; }
    if (run) return `[:, ${pos[0]}:${pos[0] + pos.length}]`;
    const name = `_IDX${plan.consts.length}`; plan.consts.push(`${name} = torch.tensor([${Array.from(pos).join(', ')}])`);
    return `[:, ${name}]`;
  };
  // An expression in torch code. Values are [B, N] per sample ('b'), [1, N] for weights ('w') or plain numbers.
  plan.exprPy = (n, src, where, xVar) => {   // xVar: an Activation's input, for its function of x
    const ast = bindVars(parseLoss(src), n, !!xVar), owner = where === 'forward' ? 'self' : 'model';
    const kindOf = (...xs) => xs.some(x => x.k === 'b') ? 'b' : xs.some(x => x.k === 'w') ? 'w' : 'num';
    const tr = a => {
      switch (a.k){
        case 'num': return {c:pyNum(a.v), k:'num'};
        case 'ref': {
          if (a._var != null) return {c:pyNum(a._varVal), k:'num'};
          if (a._x) return {c:`${xVar}.flatten(1)`, k:'b'};
          if (a.attr){
            const wv = weightView(a, n._g), layer = a.attr === 'pre_weights' ? lookup(a.key0, n._g).node : wv.M, mod = plan.mods.get(layer.id);
            return {c:`${owner}.${mod.name}.weight.reshape(1, -1)${pick(wv.pos)}`, k:'w'};
          }
          const node = lookup(a.key, n._g).node;
          if (node.type === 'loss'){
            if (where === 'forward') throw new Error('an input cell can\'t use a Loss block in the export.');
            return {c:`loss_${pyName(node.name)}_per_sample(model, y)`, k:'b'};
          }
          const base = where === 'forward' ? plan.varOf.get(node.id) : `model.acts[${JSON.stringify(plan.pathOf.get(node.id).join('.'))}]`;
          const sh = node._out || (node._in && node._in[0]);
          return {c:`${base}.flatten(1)${a._idx ? pick(selIndex(sh, a._idx, a.label)) : ''}`, k:'b'};
        }
        case 'neg': { const x = tr(a.a); return {c:`(-${x.c})`, k:x.k}; }
        case 'bin': { const x = tr(a.a), y = tr(a.b); return {c:`(${x.c} ${a.op === '^' ? '**' : a.op} ${y.c})`, k:kindOf(x, y)}; }
        case 'fn': {
          const xs = a.args.map(tr), x = xs[0], t = s => x.k === 'num' ? `torch.as_tensor(${s})` : s;
          switch (a.f){
            case 'abs': return {c:`torch.abs(${t(x.c)})`, k:x.k};
            case 'log': return {c:`torch.log(torch.clamp(${t(x.c)}, min=1e-12))`, k:x.k};
            case 'exp': return {c:`torch.exp(${t(x.c)})`, k:x.k};
            case 'sqrt': return {c:`torch.sqrt(torch.clamp(${t(x.c)}, min=0))`, k:x.k};
            case 'tanh': return {c:`torch.tanh(${t(x.c)})`, k:x.k};
            case 'sigmoid': return {c:`torch.sigmoid(${t(x.c)})`, k:x.k};
            case 'relu': return {c:`torch.relu(${t(x.c)})`, k:x.k};
            case 'softmax': return x.k === 'num' ? {c:'1.0', k:'num'} : {c:`torch.softmax(${x.c}, dim=1)`, k:x.k};
            case 'max': case 'min': {
              if (xs.length === 1) return x.k === 'num' ? x : {c:`${x.c}.${a.f === 'max' ? 'amax' : 'amin'}(1, keepdim=True)`, k:x.k};
              const y = xs[1], tt = z => z.k === 'num' ? `torch.as_tensor(${z.c})` : z.c;
              return {c:`torch.${a.f === 'max' ? 'maximum' : 'minimum'}(${tt(x)}, ${tt(y)})`, k:kindOf(x, y)};
            }
            case 'sum': return x.k === 'num' ? x : {c:`${x.c}.sum(1, keepdim=True)`, k:x.k};
            case 'mean': return x.k === 'num' ? x : {c:`${x.c}.mean(1, keepdim=True)`, k:x.k};
            case 'mse': { const k = kindOf(x, xs[1]); return {c:`((${x.c} - ${xs[1].c}) ** 2)${k === 'num' ? '' : '.mean(1, keepdim=True)'}`, k}; }
            case 'ce': case 'nll':

              return a.f === 'ce' ? {c:`F.cross_entropy(${x.c}, y, reduction="none").unsqueeze(1)`, k:'b'}
                : {c:`F.nll_loss(torch.log(torch.clamp(${x.c}, min=1e-7)), y, reduction="none").unsqueeze(1)`, k:'b'};

    for (const n of topo(g)){
      const ins = []; for (const e of g.edges) if (e.to === n.id && e.port < DEFS[n.type].ins && wired(n, e.port)) ins[e.port] = plan.varOf.get(e.from) ?? 'None';
      for (let i = 0; i < DEFS[n.type].ins; i++){   // inputs given by expressions, shaped like the input they feed
        const src = portExpr(n, i); if (!src) continue;
        const v = un(prefix + n.name + '_in' + (DEFS[n.type].ins > 1 ? 'ab'[i] : '')), sh = (n._in && n._in[i]) || [1];
        try {
          const r = plan.exprPy(n, src, 'forward'); if (r.k !== 'b') plan.needB = true;

        } catch(err){ plan.fwd.push(`${v} = None   # ${src}: ${err.message}`); }
        ins[i] = v;
      }
      const a = ins[0] ?? 'None', b = ins[1] ?? 'None', set = v => plan.varOf.set(n.id, v);
      switch (n.type){
        case 'data': if (ins[0] != null){ plan.fwd.push(`# ${n.name} collects ${ins[0]}`); set(ins[0]); break; }   // a collecting Data component passes the flow on
        // falls through
        case 'input': { const v = un(n.name); plan.args.push(v); set(v); break; }
        case 'sliders': {   // their current values, as a constant
          const v = un(prefix + n.name); plan.needB = true;
          plan.fwd.push(`${v} = torch.tensor([${(n.props.sliders || []).map(s => pyNum(Number(s.value) || 0)).join(', ')}]).expand(_B, -1)   # ${(n.props.sliders || []).map(s => s.name).join(', ')}`);
          set(v); break;
        }

        case 'plot2d': case 'plot3d': break;   // a view, not part of the model   // its input goes to the stretch its pair runs
        case 'ptrout': {   // the stretch again, calling the same modules

          const keep = new Map(plan.varOf), x = plan.varOf.get(n._ptr.I.id) ?? 'None';
          plan.fwd.push(`# ${n.name}: ${n._ptr.a.name} … ${n._ptr.z.name} again on ${n._ptr.I.name}, same weights`);
          plan.reuse = (plan.reuse || 0) + 1; const v = emit(n._pg, x, prefix + pyName(n.name) + '_'); plan.reuse--;

        }
        case 'add': { const v = un(prefix + n.name); plan.fwd.push(`${v} = ${a} + ${b}`); set(v); break; }
        case 'concat': { const v = un(prefix + n.name); plan.fwd.push(`${v} = torch.cat([${a}, ${b}], dim=1)`); set(v); break; }
        case 'activation':
          if (!presetOf(n)){   // a function of its own: inline torch code
            const v = un(prefix + n.name), fn = String((n._p || n.props).fn);
            try { const r = plan.exprPy(n, fn, 'forward', a); if (r.k !== 'b') plan.needB = true; plan.fwd.push(`${v} = ${shapeCode(r, n._out || [1])}   # f(x) = ${fn}`); }
            catch(err){ plan.fwd.push(`${v} = None   # f(x) = ${fn}: ${err.message}`); }
            set(v); break;
          }   // falls through: a built-in becomes its PyTorch module
        default: {
          if (plan.reuse && plan.mods.has(n.id)){ const v = un(prefix + n.name); plan.fwd.push(`${v} = self.${plan.mods.get(n.id).name}(${a})`); set(v); break; }   // inside a Pointer
          let src = a; if (n._src){ src = un(prefix + n.name + '_in'); plan.args.push(src); }
          const m = un(prefix + n.name); plan.init.push(`self.${m} = ${moduleOf(n)}`); plan.fwd.push(`${m} = self.${m}(${src})`); set(m);

        }
      }
    }
    return goutVar;
  };
  emit(root, null, '');
  return plan;
}

function codegen(){
  const plan = exportPlan(), L = ['import torch', 'import torch.nn as nn', 'import torch.nn.functional as F', 'from safetensors.torch import load_file', ''];
  if (stats.errs) L.push(`# Note: the graph has ${stats.errs} unresolved issue${stats.errs>1?'s':''}; values marked "?" or None need fixing.`, '');
  const lossCode = plan.losses.map(n => { try { return {n, r:plan.exprPy(n, n.props.expr, 'loss')}; } catch(err){ return {n, err:err.message}; } });
  const vars = [];   // variables are exported with their current slider values
  (function walk(g){ for (const n of g.nodes){ for (const v of n._vars || []) vars.push(`#   ${n.name}: ${v} = ${n.props.vars[v].value}`); if (n.graph) walk(n.graph); } })(root);
  if (vars.length) L.push('# Variables, at their current values:', ...vars, '');
  if (plan.consts.length) L.push(...plan.consts, '');
  L.push('', 'class Net(nn.Module):', '    def __init__(self):', '        super().__init__()');
  if (!plan.init.length) L.push('        pass');
  plan.init.forEach(s => L.push('        ' + s));
  L.push('', `    def forward(self${plan.args.length ? ', ' + plan.args.join(', ') : ''}):`);
  if (plan.needB) L.push(`        _B = ${plan.args.length ? plan.args[0] + '.shape[0]' : '1'}`);
  plan.fwd.forEach(s => L.push('        ' + s));
  const acts = []; for (const [id, v] of plan.varOf) if (v && v !== 'None') acts.push(`${JSON.stringify(plan.pathOf.get(id).join('.'))}: ${v}`);
  L.push('        # every component\'s output, by the name Netgraph shows (Loss functions read these)');
  L.push(`        self.acts = {${acts.join(', ')}}`);
  L.push('        return ' + (plan.rets.length ? plan.rets.join(', ') : 'None  # add an Output layer'));
  for (const {n, r, err} of lossCode){
    const f = pyName(n.name);
    L.push('', '');
    if (err){ L.push(`# ${n.name} = ${n.props.expr}`, `# Not exported: ${err}`); continue; }
    L.push(`def loss_${f}_per_sample(model, y):`, `    """${n.name} = ${n.props.expr.replace(/"""/g, '')}, for each sample. Call model(x) first; y holds the labels."""`);
    L.push(`    return ${r.k === 'num' ? `torch.full((y.shape[0], 1), ${r.c})` : `${r.c}.mean(1, keepdim=True)`}`);
    L.push('', '', `def loss_${f}(model, y):`, `    return loss_${f}_per_sample(model, y).mean()`);
  }
  const first = lossCode.find(l => !l.err);
  if (first){
    const p = first.n.props, opt = p.optimizer === 'sgd' ? `torch.optim.SGD(model.parameters(), lr=${p.lr}, momentum=0.9)` : `torch.optim.Adam(model.parameters(), lr=${p.lr})`;
    L.push('', '', `def train(model, loader, epochs=${p.epochs}):`, `    """Trains like Netgraph's Train button on ${first.n.name}. loader gives batches (x, y) shaped like the Data component."""`,
      `    opt = ${opt}`, '    for _ in range(epochs):', '        model.train()', '        for x, y in loader:', '            opt.zero_grad()', '            model(x)',
      `            loss_${pyName(first.n.name)}(model, y).backward()`, '            opt.step()');
  }
  L.push('', '', 'if __name__ == "__main__":', '    model = Net()',
    '    # The weights from Netgraph: use "Download weights" in the export window, next to this file.',
    '    # model.load_state_dict(load_file("netgraph_weights.safetensors"))', '    model.eval()',
    `    print(sum(p.numel() for p in model.parameters()))  # ${stats.params.toLocaleString()} expected`);

function stateDict(plan = exportPlan()){

// The safetensors format: an 8-byte little-endian header length, a JSON header, then the raw tensor bytes.
function safetensors(tensors){

  for (const t of tensors){ const bytes = t.data.byteLength; header[t.name] = {dtype:t.dtype || 'F32', shape:t.shape, data_offsets:[off, off + bytes]}; off += bytes; }

  dv.setBigUint64(0, BigInt(hb.length), true); buf.set(hb, 8);

  for (const t of tensors){ buf.set(new Uint8Array(t.data.buffer, t.data.byteOffset, t.data.byteLength), o); o += t.data.byteLength; }

/* ===== engine/project.js ===== */
/* Netgraph engine: project files.
   A project file is JSON: {format:'netgraph', version, saved, graph, blocks, weights}. graph is the network as the
   app stores it; blocks are the saved "My blocks"; weights are the trained layers' parameters (with BatchNorm's
   running statistics) as base64 float32. Datasets are not included, only referred to by id. */
const PROJECT_VERSION = 1;

const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function toBase64(bytes){
  let s = '';
  for (let i = 0; i < bytes.length; i += 3){
    const a = bytes[i], b = bytes[i + 1], c = bytes[i + 2], n = (a << 16) | ((b ?? 0) << 8) | (c ?? 0);
    s += B64[n >> 18 & 63] + B64[n >> 12 & 63] + (b === undefined ? '=' : B64[n >> 6 & 63]) + (c === undefined ? '=' : B64[n & 63]);
  }
  return s;
}
function fromBase64(s){
  const clean = String(s).replace(/[^A-Za-z0-9+/]/g, ''), out = new Uint8Array(Math.floor(clean.length*3/4)), map = {};
  for (let i = 0; i < 64; i++) map[B64[i]] = i;
  let o = 0;
  for (let i = 0; i < clean.length; i += 4){
    const n = (map[clean[i]] << 18) | (map[clean[i + 1]] << 12) | ((map[clean[i + 2]] ?? 0) << 6) | (map[clean[i + 3]] ?? 0);
    if (o < out.length) out[o++] = n >> 16 & 255;
    if (o < out.length && i + 2 < clean.length) out[o++] = n >> 8 & 255;
    if (o < out.length && i + 3 < clean.length) out[o++] = n & 255;
  }
  return out;
}
const f32ToB64 = a => a ? toBase64(new Uint8Array(a.buffer, a.byteOffset, a.byteLength)) : null;
const b64ToF32 = s => { if (s == null) return null; const b = fromBase64(s); return new Float32Array(b.buffer, 0, b.byteLength >> 2); };

function projectJSON(blocks = []){
  const ids = new Set(); (function walk(g){ for (const n of g.nodes){ ids.add(n.id); if (n.graph) walk(n.graph); } })(root);
  const weights = exportWeights(true).filter(r => ids.has(r.id))
    .map(r => ({id:r.id, key:r.key, W:f32ToB64(r.W), B:f32ToB64(r.B), rm:f32ToB64(r.rm), rv:f32ToB64(r.rv), nbt:r.nbt}));
  return JSON.stringify({format:'netgraph', version:PROJECT_VERSION, saved:new Date().toISOString(), graph:strip(root), blocks, weights});
}

// Reads a project file. Returns {graph, blocks, weights, missing} (missing: dataset ids the graph uses that aren't
// loaded), or throws an Error saying what's wrong. Does not change anything yet.
function readProject(text){
  let p;
  try { p = JSON.parse(text); } catch(e){ throw new Error('This file isn\'t valid JSON.'); }
  if (!p || p.format !== 'netgraph') throw new Error('This isn\'t a Netgraph project file.');
  if (!(p.version >= 1)) throw new Error('This project file has no version.');
  if (p.version > PROJECT_VERSION) throw new Error(`This project file is from a newer Netgraph (version ${p.version}).`);
  const g = p.graph;
  if (!g || !Array.isArray(g.nodes) || !Array.isArray(g.edges)) throw new Error('The project file has no network in it.');
  const missing = new Set(), badType = [];
  (function check(gr){
    for (const n of gr.nodes){
      if (!n || !n.id || !DEFS[n.type]) { badType.push(n && n.type); continue; }
      n.props ||= {};
      const collects = (gr.edges || []).some(e => e.to === n.id) || (n.props.inputs && n.props.inputs[0]);   // what it collected isn't in the file
      if (n.type === 'data' && n.props.dataset && !collects && !dsById(n.props.dataset)) missing.add(n.props.dataset);
      if (n.type === 'group'){ if (!n.graph || !Array.isArray(n.graph.nodes)) throw new Error(`The block "${n.name}" has no inside.`); check(n.graph); }
    }
  })(g);
  if (badType.length) throw new Error(`Unknown component type${badType.length > 1 ? 's' : ''}: ${[...new Set(badType)].join(', ')}.`);
  const weights = (p.weights || []).map(r => ({id:r.id, key:r.key, W:b64ToF32(r.W), B:b64ToF32(r.B), rm:b64ToF32(r.rm), rv:b64ToF32(r.rv), nbt:r.nbt || 0, trained:true}));
  return {graph:g, blocks:Array.isArray(p.blocks) ? p.blocks : [], weights, missing:[...missing]};
}

/* ===== engine/worker.js ===== */
/* Netgraph engine: the training worker.
   The page starts a Web Worker from this same engine code, so training runs off the main thread. Messages in:
   {type:'dataset', ds} once per dataset; {type:'train', root, weights, lossId, opts}; {type:'evaluate', root,
   weights, lossId}; {type:'collect', root, weights, srcId}; {type:'stop'}. Messages out: 'progress' and 'epoch'
   (with T and the weights so far), 'done', 'evaluated', 'cprogress', 'collected' and 'error'. This block only runs inside a worker. */
if (typeof document === 'undefined' && typeof importScripts === 'function' && typeof self !== 'undefined'){
  let stopFlag = false;
  const hooks = {
    yield: () => new Promise(r => setTimeout(r, 0)),   // lets a 'stop' message in
    shouldStop: () => stopFlag,
    progress: T => self.postMessage({type:'progress', T, weights:exportWeights()}),
    epochDone: T => self.postMessage({type:'epoch', T, weights:exportWeights()}),
  };
  self.onmessage = async e => {
    const m = e.data;
    if (m.type === 'stop'){ stopFlag = true; return; }
    if (m.type === 'dataset'){ datasets = datasets.filter(d => d.id !== m.ds.id).concat(m.ds); splitCache.clear(); return; }
    root = m.root; wcache.clear(); importWeights(m.weights); stopFlag = false;
    try {
      if (m.type === 'train'){ const T = await trainLoop(m.lossId, m.opts, hooks); self.postMessage({type:'done', T, weights:exportWeights()}); }
      else if (m.type === 'collect'){
        const caps = await collectLoop(m.srcId, {...hooks, progress:(done, N) => self.postMessage({type:'cprogress', done, N})});
        self.postMessage({type:'collected', caps}, Object.values(caps).flatMap(c => [c.x.buffer, c.labels.buffer]));
      }
      else if (m.type === 'evaluate'){ const ctx = makeCtx(m.lossId); self.postMessage({type:'evaluated', r:await evaluateSet(ctx, ctx.sp.test, Infinity, hooks)}); }
    } catch(err){ self.postMessage({type:'error', message:err.message}); }
  };
}

/* ---------- persistence ---------- */
const KEY = 'netgraph.v1';
let saveT;

/* ---------- undo ---------- */
// Every save compares the graph with the last snapshot; a real change becomes an undo step.
// Edits within one save delay (like typing a name) land in a single step. Browsing samples isn't a step.

function commit(){
  const o = strip(root), s = JSON.stringify(o), k = JSON.stringify(o, (key, v) => key === 'index' ? undefined : v);
  if (hist.cur && hist.cur.k === k){ hist.cur.s = s; return; }
  if (hist.cur){ hist.past.push(hist.cur); if (hist.past.length > 200) hist.past.shift(); hist.future = []; }
  hist.cur = {s, k, path:[...path]};

}
function undoBtns(){ $('#bUndo').disabled = !hist.past.length; $('#bRedo').disabled = !hist.future.length; }
function stepHistory(back){
  flushSave();

  const from = back ? hist.past : hist.future, to = back ? hist.future : hist.past;
  if (!from.length){ toast(back ? 'Nothing to undo.' : 'Nothing to redo.'); return; }
  to.push(hist.cur); hist.cur = from.pop();
  root = JSON.parse(hist.cur.s); path = [...hist.cur.path]; cur();   // cur() drops a path that no longer exists

function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.root && Array.isArray(s.root.nodes)){ root = s.root; lib = Array.isArray(s.lib) ? s.lib : []; return true; } } catch(e){} return false; }

/* ---------- view ---------- */
function toWorld(cx, cy){ const r = cv.getBoundingClientRect(); return {x:(cx - r.left - view.x)/view.k, y:(cy - r.top - view.y)/view.k}; }
function fit(){
  const g = cur(), r = cv.getBoundingClientRect();

  else {
    if (!g.nodes.length){ view = {x:r.width/2-100, y:r.height/2-60, k:1}; applyView(); return; }
    for (const n of g.nodes){ const b = boxes.get(n.id); x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+(b ? b.w : n.w || W)); y1=Math.max(y1,n.y+(b ? b.h : 150)); }

  if (!S.size){ toast('Select one or more components to group.'); return; }

/* ---------- copy & paste ---------- */
let clip = null, lastPtr = null;
function copySel(quiet){

/* ---------- example ---------- */
function example(){
  root = {nodes:[], edges:[]}; path = []; nview = null; sel.clear(); selWire = null;
  const put = (n, x) => { n.x = x; n.y = 40; root.nodes.push(n); return n; };
  const inp = put(mk('data', 0, 0, {dataset:'mnist'}), 0);
  const cb = c => blockFrom('Conv block', [['conv2d',{out_channels:c}],['batchnorm'],['relu'],['maxpool']]);
  const b1 = cb(16); b1.name = nextBlockName('Conv block'); put(b1, 250);

  const fl = put(mk('flatten'), 750);
  const mlp = BUILTIN[0].make(); mlp.name = nextBlockName('MLP'); put(mlp, 1000);
  const fc = put(mk('dense', 0, 0, {out_features:10}), 1250);
  const sm = put(mk('softmax'), 1500);

// Grouping and ungrouping change components' dotted names (fc1 becomes Block.fc1 and back); expressions follow.

/* ===== ui/train.js ===== */
/* ---------- training (page side) ---------- */
/* Training runs in a Web Worker made from the engine's own source (the <script id="engine"> text), so the page
   stays responsive. The worker gets a copy of the graph, the weights and (once) the dataset, and streams back
   progress with the weights so far. If a worker can't be started, the same loop runs here on the page. */
const yieldNow = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
let TR = null;                 // the running job: {id, running, worker?}
const trainLog = new Map();    // loss block id → progress, loss history, accuracy (the T objects from trainLoop)
const isTraining = n => !!(TR && TR.running && TR.id === n.id);
let worker = null, workerFailed = false, workerJob = null;
const workerData = new Set();  // dataset ids the worker already has
function getWorker(){
  if (worker || workerFailed) return worker;
  try {
    const src = document.getElementById('engine').textContent;
    worker = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
    worker.onmessage = e => workerJob && workerJob(e.data);
    worker.onerror = e => { e.preventDefault(); workerFailed = true; worker = null; workerData.clear(); if (workerJob) workerJob({type:'error', message:'the training worker stopped unexpectedly.', fatal:true}); };
  } catch(e){ workerFailed = true; worker = null; }
  return worker;
}
function sendDataset(w, ds){ if (!workerData.has(ds.id)){ w.postMessage({type:'dataset', ds}); workerData.add(ds.id); } }
function toggleTrain(id){
  const n = findNode(id); if (!n) return;
  if (isTraining(n)){ TR.running = false; if (TR.worker) TR.worker.postMessage({type:'stop'}); render(); }
  else startTrain(n);
}
function trainOpts(n){
  const p = n.props, lr = Number(p.lr), bs = Math.floor(Number(p.batch)), epochs = Math.floor(Number(p.epochs));
  if (!(lr > 0)) return {err:'Learning rate must be a positive number, like 0.001.'};
  if (!(bs >= 1)) return {err:'Batch size must be a whole number of at least 1.'};
  if (!(epochs >= 1)) return {err:'Epochs must be a whole number of at least 1.'};
  return {lr, bs, epochs, optimizer:p.optimizer === 'sgd' ? 'sgd' : 'adam'};
}
// Checks everything the page can before starting; returns the dataset in use, or null after saying why not.
function trainReady(n){
  let ctx; try { ctx = makeCtx(n.id); } catch(err){ toast(err.message); return null; }
  return ctx;
}
async function startTrain(n){
  const ctx = trainReady(n); if (!ctx) return;
  if (CR && CR.running){ toast('Wait for the inference run to finish, or stop it first.'); return; }
  const opts = trainOpts(n); if (opts.err){ toast(opts.err); return; }
  if (!ctx.sp.train.length){ toast('The Data component has no training samples. Lower its test split.'); return; }
  if (TR && TR.running) toggleTrain(TR.id);
  const job = TR = {id:n.id, running:true, worker:null};
  const T0 = {id:n.id, epoch:0, epochs:opts.epochs, step:0, steps:Math.ceil(ctx.sp.train.length/opts.bs), hist:[], raw:[], tests:[], ema:null, trainAcc:null, testAcc:null, testN:0};
  trainLog.set(n.id, T0);
  render();
  const finish = async (T, err) => {
    job.running = false; if (TR === job) TR = null;
    if (T) trainLog.set(n.id, {...T, running:false});
    await saveWeights(); render();
    if (err) toast(`Training stopped: ${err}`);
    else if (T && T.done) toast(`Training finished.${T.testAcc != null ? ` Test accuracy ${(100*T.testAcc).toFixed(1)}% on ${T.testN.toLocaleString()} samples.` : T.testLoss != null ? ` Test loss ${T.testLoss.toFixed(4)} on ${T.testN.toLocaleString()} samples.` : ''}`);
  };
  const w = getWorker();
  if (w){
    job.worker = w; let lastDraw = 0;
    sendDataset(w, ctx.ds);
    workerJob = async msg => {
      if (TR !== job && msg.type !== 'done' && msg.type !== 'error') return;
      if (msg.weights) importWeights(msg.weights);
      if (msg.type === 'progress' || msg.type === 'epoch'){
        trainLog.set(n.id, msg.T);
        if (msg.type === 'epoch') saveWeights();
        if (now() - lastDraw > 250){ lastDraw = now(); soft(); }
      } else if (msg.type === 'done'){ workerJob = null; await finish(msg.T); }
      else if (msg.type === 'error'){ workerJob = null; await finish(trainLog.get(n.id), msg.message); }
    };
    w.postMessage({type:'train', root:strip(root), weights:exportWeights(), lossId:n.id, opts});
    return;
  }
  // No worker: the same loop on the page, pausing now and then so the page can draw.
  let lastDraw = 0;
  try {
    const T = await trainLoop(n.id, opts, {
      yield: yieldNow,
      shouldStop: () => !job.running,
      progress: T => { trainLog.set(n.id, T); if (now() - lastDraw > 400){ lastDraw = now(); soft(); } },
      epochDone: () => saveWeights(),
    });
    await finish(T);
  } catch(err){ await finish(trainLog.get(n.id), err.message); }
}
async function evalFull(n){
  if (TR && TR.running){ toast('Wait for training to finish, or stop it first.'); return; }
  const ctx = trainReady(n); if (!ctx) return;
  if (!ctx.sp.test.length){ toast('The Data component has no test samples. Raise its test split.'); return; }
  const T = trainLog.get(n.id) || {id:n.id, hist:[], epoch:0, epochs:0, step:0, steps:0};
  trainLog.set(n.id, T); T.evaluating = true; render();
  const done = r => { Object.assign(T, r || {}); T.evaluating = false; render(); if (T.testN) toast(`${T.testAcc != null ? `Test accuracy ${(100*T.testAcc).toFixed(1)}%, l` : 'L'}oss ${T.testLoss.toFixed(4)} on all ${T.testN.toLocaleString()} test samples.`); };
  const w = getWorker();
  if (w){
    sendDataset(w, ctx.ds);
    workerJob = msg => {
      if (msg.type === 'evaluated'){ workerJob = null; done(msg.r); }
      else if (msg.type === 'error'){ workerJob = null; T.evaluating = false; render(); toast(`Evaluation stopped: ${msg.message}`); }
    };
    w.postMessage({type:'evaluate', root:strip(root), weights:exportWeights(), lossId:n.id});
    return;
  }
  try { done(await evaluateSet(ctx, ctx.sp.test, Infinity, {yield:yieldNow, shouldStop:() => false})); }
  catch(err){ T.evaluating = false; render(); toast(`Evaluation stopped: ${err.message}`); }
}
function resetWeights(){
  if (TR && TR.running){ toast('Stop training before resetting the weights.'); return; }
  (function walk(g){ for (const m of g.nodes){ wcache.delete(m.id); if (m.graph) walk(m.graph); } })(root);
  trainLog.clear();
  dbTx('readwrite', st => st.clear(), 'weights').catch(() => {});
  render(); toast('Weights reset to fresh random values.');
}

/* ---------- inference runs (page side) ---------- */
/* A Data component sends its samples through the network; every collecting Data component the flow reaches keeps

let CR = null;   // the running inference run: {id, running, done, N, worker?}
const isCollecting = n => !!(CR && CR.running && CR.id === n.id);
function toggleCollect(id){
  const n = findNode(id); if (!n) return;

async function startCollect(n){

// Fits a PCA component, then runs the whole dataset through it into the Data components (and plots) after it.
async function toggleFitPca(id){
  const n = findNode(id); if (!n) return;
  if (isCollecting(n)){ CR.running = false; render(); return; }
  if (TR && TR.running){ toast('Wait for training to finish, or stop it first.'); return; }
  if (CR && CR.running) return;
  const job = CR = {id:n.id, running:true, done:0, N:0};
  render();
  const progress = (done, total) => { job.done = done; job.N = total; const el = insp.querySelector('.iprog'); if (el) el.textContent = `${done.toLocaleString()} / ${total.toLocaleString()}`; };
  const hooks = {yield:yieldNow, shouldStop:() => !job.running, progress};
  let msg;
  try {
    const r = await fitPCA(n.id, hooks), pct = (100*r.ratio.reduce((a, v) => a + v, 0)).toFixed(1);
    await saveWeights(); infer();
    msg = `Fitted ${r.k} component${r.k > 1 ? 's' : ''} on ${r.n.toLocaleString()} samples: ${pct}% of the variance.`;
    const outs = collectorsOf(n);
    if (outs.length && job.running){
      const caps = await collectLoop(r.d.id, hooks, {all:true, only:outs});
      msg += ` Projected into ${keepCollected(r.d, caps, `whole dataset, through ${n.name}`).join(' · ')}.`;
    } else if (!outs.length) msg += ' Wire its output into a Data component to keep the projected data.';
  } catch(err){ msg = `PCA stopped: ${err.message}`; }

insp.addEventListener('keydown', e => {

insp.addEventListener('input', e => {
